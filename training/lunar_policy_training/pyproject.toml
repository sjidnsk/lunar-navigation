[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-policy-training"
version = "0.1.0"
description = "Shared seven-input PPO policy training core"
requires-python = ">=3.10"
dependencies = ["numpy", "PyYAML", "torch"]

[project.scripts]
lunar-policy-training = "lunar_policy_training.cli:main"

[tool.pytest.ini_options]
markers = [
    "cuda: requires a CUDA-capable PyTorch installation",
    "integration: requires an explicitly configured external source repository",
]
