parallel:
  worker_candidates: [18, 24]
  preferred_workers: 24
  joint_workers:
    WHEELED: 8
    LEGGED: 8
    HOPPER: 8
  nested_compute_threads: 1
  gpu_memory_fraction_max: 0.90
ppo:
  gamma: 0.995
  gae_lambda: 0.95
  policy_clip: 0.20
  value_clip: 0.20
  learning_rate: 0.0003
  optimizer: AdamW
  weight_decay: 0.0001
  adam_epsilon: 0.00001
  epochs_per_update: 4
  target_kl: 0.03
  value_loss_coefficient: 0.5
  frontier_entropy_coef: 0.01
  theta_entropy_coef: 0.001
  max_grad_norm: 0.5
  rollout_horizon: 32
  dtype: float32
checkpoint_interval_seconds: 1800
candidate_checkpoint_interval_seconds: 3600
total_gpu_budget_seconds: 86400
formal_training_seeds: [4080]
run_kind: development-smoke
