parallel:
  worker_candidates: [24]
  preferred_workers: 24
  joint_workers:
    WHEELED: 8
    LEGGED: 8
    HOPPER: 8
  nested_compute_threads: 1
  gpu_memory_fraction_max: 0.90
task_area:
  minimum_size_m: 100.0
  maximum_size_m: 500.0
  sampling_algorithm: deterministic-uniform-square/v1
ppo:
  gamma: 0.995
  gae_lambda: 0.95
  policy_clip: 0.20
  value_clip: 0.20
  learning_rate: 0.0003
  optimizer: AdamW
  weight_decay: 0.0001
  adam_epsilon: 0.00001
  epochs_per_update: 4
  target_kl: 0.03
  value_loss_coefficient: 0.5
  frontier_entropy_coef: 0.01
  theta_entropy_coef: 0.001
  max_grad_norm: 0.5
  rollout_horizon: 1
  dtype: float32
checkpoint_interval_seconds: 1800
candidate_checkpoint_interval_seconds: 3600
total_gpu_budget_seconds: 86400
formal_training_seeds: [4080]
run_kind: formal
reward_v4:
  success_threshold: 0.95
  coverage_weight: 100.0
  success_bonus: 100.0
  terminal_gap_weight: 1.0
  priority_weight: 5.0
  path_weight: 1.0
  gamma: 0.995
  gae_lambda: 0.95
  macro_actions_per_worker: 1
  evaluation_seeds: [4081, 4082, 4083]
  evaluation_interval_gpu_s: 10800
  evaluation_tasks_per_bucket: 3
  capability_success_rate: 0.80
  capability_mean_final_coverage: 0.90
  consecutive_gate_confirmations: 2
  relative_success_drop_tolerance: 0.02
  relative_coverage_drop_tolerance: 0.01
  reentry_priority_weights: [2.5, 1.25]
  reentry_path_weights: [0.5, 0.25]
  maximum_efficiency_rollbacks: 2
  task_alignment_m: 4.0
  priority_side_divisor: 4
  advantage_std_floor: 0.00000001
  scale_bucket_bounds_m:
    - [100.0, 200.0]
    - [200.0, 300.0]
    - [300.0, 400.0]
    - [400.0, 500.0]
  scale_bucket_weights: [0.25, 0.25, 0.25, 0.25]
  ground_platform_weights:
    - [WHEELED, 0.5]
    - [LEGGED, 0.5]
  joint_platform_weights:
    - [WHEELED, 0.3333333333333333]
    - [LEGGED, 0.3333333333333333]
    - [HOPPER, 0.3333333333333333]
  ground_worker_counts:
    - [WHEELED, 12]
    - [LEGGED, 12]
  joint_worker_counts:
    - [WHEELED, 8]
    - [LEGGED, 8]
    - [HOPPER, 8]
